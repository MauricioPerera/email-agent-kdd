[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-agent-cli"
version = "0.2.0"
description = "Local, agent-friendly email synchronization and search CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Email Agent contributors"}]
dependencies = ["pypdf>=4,<7"]

[project.scripts]
email-agent = "src.email.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

